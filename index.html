<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <main id="app">
        <!-- Seleção do modo -->
        <section id="mode-screen" class="screen active">
            <div class="menu-content">
                <h1>Welcome!</h1>
                <h2>Choose the game mode:</h2>
                <nav class="menu-buttons">
                    <button type="button" class="mode-button" data-mode="single">Single player</button>
                    <button type="button" class="mode-button" data-mode="two">Two players</button>
                </nav>
            </div>
            <div id="player-names-container">
                <h2>Insert your names:</h2>
                <div class="input-group">
                    <input type="text" id="player1-name-input" placeholder="Player 1" maxlength="12">
                    <input type="text" id="player2-name-input" placeholder="Player 2" maxlength="12">
                </div>
                <button type="button" id="start-two-players-btn">Go</button>
            </div>
        </section>

        <!-- Seleção do tema -->
        <section id="theme-screen" class="screen">
            <div class="menu-content">
                <h1>Welcome!</h1>
                <h2>Choose the theme:</h2>
                <nav class="menu-buttons">
                    <button type="button" class="theme-button" data-theme="monuments">Monuments</button>
                    <button type="button" class="theme-button" data-theme="flags">Flags</button>
                </nav>
            </div>
        </section>

        <!-- Jogo -->
        <section id="game-screen" class="screen">
            <h1>Memory Game</h1>
            <header class="stats-board">
                <!-- Single player -->
                <div id="single-player-stats" class="player-stats-container">
                    <div class="stat-item">Time: <span id="timer">00:00</span></div>
                    <div class="stat-item">Score: <span id="score">0</span>/<span id="max">0</span></div>
                    <div class="stat-item">Moves: <span id="moves">0</span></div>
                </div>

                <!-- Two players -->
                <div id="two-player-stats" class="player-stats-container hidden">
                    <div id="player-1-box" class="stat-item player-box active-turn">
                        <div id="label-player-1">Player 1</div>
                        <div class="points"><span id="score-1">0</span> points</div>
                    </div>
                    <div id="player-2-box" class="stat-item player-box">
                        <div id="label-player-2">Player 2</div>
                        <div class="points"><span id="score-2">0</span> points</div>
                    </div>
                </div>
            </header>

            <div class="grid-container"></div>

            <nav class="actions">
                <button type="button" class="restart-button">Restart game</button>
                <button type="button" class="menu-button">Main menu</button>
            </nav>
        </section>

        <!-- Vitória -->
        <section id="win-screen" class="screen">
            <h1 id="win-title"></h1>

            <!-- Single player Win Stats -->
            <div id="single-player-win-stats" class="player-stats-container column">
                <div class="player-stats-container round-margin">
                    <div class="stat-item">Time: <span id="final-time-single">00:00</span></div>
                    <div class="stat-item">Wrong moves: <span id="final-moves">0</span></div>
                </div>
                <div class="stat-item round-margin">
                    Best time: <span id="best-time">--:--</span>
                </div>
            </div>

            <!-- Two players Win Stats -->
            <div id="two-player-win-stats" class="player-stats-container column hidden">
                <div id="overall-rounds-container" class="stat-item round-margin player-stats-container">
                    <span id="win-label-player-1">Player 1</span>
                    <div class="points-box">
                        <span id="rounds-1">0</span> - <span id="rounds-2">0</span>
                    </div>
                    <span id="win-label-player-2">Player 2</span>
                </div>
            </div>

            <nav class="actions">
                <button type="button" id="play-again-button">Play again</button>
                <button type="button" class="menu-button">Main menu</button>
            </nav>
        </section>
    </main>

    <script src="index.js"></script>
</body>
</html>
