<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

    <!-- Seleção do tema -->
    <div id="theme-screen" class="screen active">
        <h1>Welcome!</h1>
        <h2>Choose the theme</h2>
        <div class="menu-buttons">
            <button class="theme-btn" data-theme="monuments">Monuments</button>
        </div>
    </div>

    <!-- Seleção do modo -->
    <div id="mode-screen" class="screen">
        <h1>Welcome!</h1>
        <h2>Choose the game mode</h2>
        <div class="menu-buttons">
            <button onclick="selectMode('single')">Single Player</button>
            <button onclick="selectMode('two')" disabled>Two Players</button>
        </div>
    </div>

    <!-- Jogo -->
    <div id="game-screen" class="screen">
        <div class="stats-board">
            <div class="stat-item">Time: <span id="timer">00:00</span></div>
            <div class="stat-item">Score: <span id="score">0</span>/<span id="max">0</span></div>
            <div class="stat-item">Attempts: <span id="attempts">0</span></div>
        </div>

        <div class="grid-container"></div>

        <div class="actions">
            <button onclick="restartGame()">Restart Game</button>
            <button onclick="backToMenu()">Main Menu</button>
        </div>
    </div>

    <!-- Tela de vitória -->
    <div id="win-screen" class="screen">
        <h1>Congratulations! You won!</h1>
        <div class="stats-board">
            <div class="stat-item">Time: <span id="final-time">00:00</span></div>
            <div class="stat-item">Wrong attempts: <span id="final-attempts">0</span></div>
        </div>
        <div class="actions">
            <button onclick="restartGame()">Play Again</button>
            <button onclick="backToMenu()">Main Menu</button>
        </div>

    </div>

    <script src="index.js"></script>
</body>
</html>
